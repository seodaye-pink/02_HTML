<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form action=" " method="get">

    <fieldset>

        <legend>기본정보</legend>
        <label>
            이메일 <input type="text" name="email" placeholder="이메일을 입력해 주세요" autofocus/>
        </label>
        <label>
            아이디 <input type="text" name="id" required minlength="4" maxlength="12"/>
        </label>
        <div>
            가입 코드 <input type="text" name="code" value="WELCOME" readonly/>
        </div>
    </fieldset>

    <fieldset>
        <legend>추가 정보</legend>
        <div>
            인원 <input type="number" name="people" min="1" max="10" step="4" value="2" />
        </div>
    </fieldset>

    <button type="submit">전송</button>
</form>

</body>
</html>
